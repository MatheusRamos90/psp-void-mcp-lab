spring:
  application:
    name: psp-void-postgres-db
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pspvoid}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8083}

seed:
  admin:
    password: ${SEED_ADMIN_PASSWORD}
  service-account:
    password: ${SEED_SERVICE_PASSWORD}
